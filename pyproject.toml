[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delay-aware"
version = "0.1.0"
description = "Data foundations for a US domestic flight assistant"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["delay_aware*"]

[tool.setuptools.package-data]
delay_aware = ["web/*.html", "web/*.css", "web/*.js"]
